# ===== SnapTrip 双进程部署 =====
# marketplace (FastAPI + Celery Beat) + Agent Worker (Celery Worker)
#
# 服务:
#   postgres     — PostgreSQL 16 (pgvector)
#   redis        — Redis 7 (Celery broker + SSE Pub/Sub + cache)
#   marketplace  — FastAPI backend (port 8080, includes Celery Beat)
#   agent-worker — Celery Worker (LangGraph async execution)
#   mock-server  — Mock API for dev/CI

services:
  # ===== 数据库 =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: snaptrip-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snaptrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DEV_DB:-snaptrip_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snaptrip} -d ${POSTGRES_DEV_DB:-snaptrip_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ===== 缓存 / 消息队列 =====
  redis:
    image: redis:7-alpine
    container_name: snaptrip-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}  # ggignore
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ===== LiteLLM Proxy —— LLM API 网关 =====
  litellm-proxy:
    image: ghcr.io/berriai/litellm:v1.83.10-stable
    container_name: snaptrip-litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER:-snaptrip}:${POSTGRES_PASSWORD:?}@postgres:5432/${LITELLM_DB:-snaptrip_litellm}  # ggignore
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}  # ggignore
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ===== Marketplace :8080 — FastAPI + Celery Beat =====
  marketplace:
    build:
      context: .
      dockerfile: backend/Dockerfile.gateway
      target: ${BUILD_TARGET:-production}
    container_name: snaptrip-marketplace
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-snaptrip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DEV_DB:-snaptrip_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0  # ggignore
      REDIS_POOL_SIZE: 10
      MOCK_API_BASE_URL: http://mock-server:8001
      MARKETPLACE_MODE: ${MARKETPLACE_MODE:-mock}
      SNAPTRIP_MARKETPLACE_URL: ${SNAPTRIP_MARKETPLACE_URL:-http://marketplace:8000}
      # ── LLM (LiteLLM Gateway) ──
      LITELLM_BASE_URL: http://litellm-proxy:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-pro}
      # ── 通用 ──
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    command: >
      sh -c "alembic upgrade head && uvicorn marketplace.app.main:app --host 0.0.0.0 --port 8000"

  # ===== Agent Worker (Celery) — LangGraph 异步执行 =====
  agent-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      target: ${BUILD_TARGET:-production}
    container_name: snaptrip-agent-worker
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-snaptrip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DEV_DB:-snaptrip_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0  # ggignore
      REDIS_POOL_SIZE: 10
      MOCK_API_BASE_URL: http://mock-server:8001
      MARKETPLACE_MODE: ${MARKETPLACE_MODE:-mock}
      SNAPTRIP_MARKETPLACE_URL: ${SNAPTRIP_MARKETPLACE_URL:-http://marketplace:8000}
      # ── LLM (LiteLLM Gateway) ──
      LITELLM_BASE_URL: http://litellm-proxy:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-pro}
      # ── 通用 ──
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A marketplace.app.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ===== Celery Beat — 定时任务调度 =====
  agent-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      target: ${BUILD_TARGET:-production}
    container_name: snaptrip-agent-beat
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-snaptrip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DEV_DB:-snaptrip_dev}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0  # ggignore
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    command: celery -A marketplace.app.celery_app beat -l info

  # ===== Mock API 服务 (dev/CI) =====
  mock-server:
    build:
      context: ./mock-services/mock-meituan
      dockerfile: Dockerfile
    container_name: snaptrip-mock
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    profiles:
      - dev
      - full

  # ===== 前端 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: snaptrip-frontend
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - marketplace
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    profiles:
      - dev
      - full

volumes:
  postgres_data:
