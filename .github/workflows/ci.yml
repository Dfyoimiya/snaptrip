name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps (workspace)
        run: uv sync --extra dev
      - name: Lint backend
        run: |
          uv run --directory backend ruff check marketplace/ tests/
          uv run --directory backend mypy marketplace/
          uv run --directory agent ruff check src/
          uv run --directory agent mypy src/
          uv run --directory shared ruff check snaptrip_shared/
          uv run --directory shared mypy snaptrip_shared/

  lint-frontend:
    name: Lint (Frontend — B-end Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check frontend
        working-directory: frontend
        run: npx -p typescript tsc --noEmit

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-test:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_TEST_URL: postgresql+asyncpg://ci_runner:ci_test_pass@localhost:5432/ci_test
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: ci-test-secret-key-not-for-prod
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod
      DEEPSEEK_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps (workspace)
        run: uv sync --extra dev
      - name: Run migrations
        run: cd backend && uv run alembic upgrade head
      - name: Unit tests
        run: cd backend && uv run pytest tests/unit/ -v --cov=marketplace --cov=agent --cov=snaptrip_shared --cov-report=xml --cov-report=term
      - name: Integration tests
        run: cd backend && uv run pytest tests/integration/ -v -m "not amap"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        if: always()
