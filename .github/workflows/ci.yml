name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps (workspace)
        run: uv sync --extra dev
      - name: make lint
        run: |
          cd backend && uv run ruff check marketplace/ tests/
          cd backend && uv run mypy marketplace/
          cd agent && uv run ruff check src/
          cd agent && uv run mypy src/
          cd shared && uv run ruff check snaptrip_shared/
          cd shared && uv run mypy snaptrip_shared/

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: make lint-frontend
        working-directory: frontend
        run: npx -p typescript tsc --noEmit

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-test:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_TEST_URL: postgresql+asyncpg://ci_runner:ci_test_pass@localhost:5432/ci_test
      REDIS_URL: redis://localhost:6379/0
      MOCK_API_BASE_URL: http://localhost:8001
      APP_SECRET_KEY: ci-test-secret-key-not-for-prod
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod
      DEEPSEEK_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps (workspace)
        run: uv sync --extra dev
      - name: make mock-up
        env:
          MOCK_FAULT_RATE: "0"
          MOCK_DELAY_RATE: "0"
        run: |
          cd mock-services/mock-meituan && nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8001/health && break
            sleep 1
          done
      - name: make migrate-up
        run: cd backend && uv run alembic upgrade head
      - name: make test-unit
        run: cd backend && uv run pytest tests/unit/ -v --cov=marketplace --cov=agent --cov=snaptrip_shared --cov-report=xml --cov-report=term
      - name: make test-integration
        run: cd backend && uv run pytest tests/integration/ -v -m "not amap"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        if: always()
