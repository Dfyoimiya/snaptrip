name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        working-directory: backend
        run: uv sync --extra dev
      - name: ruff check
        working-directory: backend
        run: uv run ruff check app/
      - name: mypy
        working-directory: backend
        run: uv run mypy app/ || true
      - name: ruff check tests
        working-directory: backend
        run: uv run ruff check tests/ || true

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install
      - name: TypeCheck
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ci_runner:ci_test_pass@localhost:5432/ci_test
      REDIS_URL: redis://localhost:6379/0
      MOCK_API_BASE_URL: http://localhost:8001
      APP_SECRET_KEY: ci-test-secret-key-not-for-prod
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod
      OPENROUTER_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        working-directory: backend
        run: uv sync && uv sync --extra dev
      - name: Start mock-server
        run: |
          cd mock_server
          pip install fastapi uvicorn pydantic
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8001/health && break
            sleep 1
          done
      - name: Run alembic
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Unit tests
        working-directory: backend
        run: uv run pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term
      - name: Integration tests
        working-directory: backend
        run: uv run pytest tests/integration/ -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        if: always()

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t snaptrip-backend:ci backend/
      - name: Build mock-server
        run: docker build -t snaptrip-mock:ci mock_server/
      - name: Build frontend
        run: docker build -t snaptrip-frontend:ci frontend/
