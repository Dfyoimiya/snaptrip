# Tool Provider 配置 —— 每个工具的运行时策略。
#
# 用途:
#   - LLM 读取: human_readable_name, llm_description, input_schema
#   - ExecutionEngine 读取: is_idempotent, physical_impact, timeout_ms,
#     max_retries, idempotency_ttl_sec, circuit_breaker_*, compensation
#
# 物理操作重试铁律:
#   L2 book_table/book_ticket: max_retries=1 (仅1次, 物理操作谨慎)
#   L2 order:                 max_retries=0 (不重试, 厨房已备餐)
#   L0/L1 纯读:               max_retries=2

[tools.search_poi]
provider = "mock"
human_readable_name = "搜索兴趣点"
llm_description = "搜索指定城市内的兴趣点(POI)，可按类别、坐标、半径过滤。返回POI列表含名称、类型、评分、价格、亲子设施等信息。这是所有本地生活规划的第一步。"
is_idempotent = true
physical_impact = false
timeout_ms = 1500
max_retries = 2
retry_delay_ms = 1000

[tools.get_user_profile]
provider = "mock"
human_readable_name = "获取用户画像"
llm_description = "获取当前用户的偏好画像与历史行为向量，包含饮食偏好、出行风格、历史拒绝记录等。用于个性化推荐。"
is_idempotent = true
physical_impact = false
timeout_ms = 500
max_retries = 2
retry_delay_ms = 1000

[tools.check_queue]
provider = "mock"
human_readable_name = "查询排队情况"
llm_description = "查询指定POI的当前排队人数和预计等待时间。用于评估是否需要提前预订或调整时间。"
is_idempotent = true
physical_impact = false
timeout_ms = 1000
max_retries = 2
retry_delay_ms = 1000

[tools.check_availability]
provider = "mock"
human_readable_name = "查询可用时段"
llm_description = "查询指定POI在给定时间范围内是否有可用时段/座位/库存。调用 book_table 或 book_ticket 之前必须先调用此工具确认可用性。"
is_idempotent = true
physical_impact = false
timeout_ms = 1000
max_retries = 2
retry_delay_ms = 1000

[tools.check_child_facility]
provider = "mock"
human_readable_name = "查询亲子设施"
llm_description = "查询指定POI的亲子友好设施：是否有母婴室、儿童座椅、儿童菜单等。带小孩出行时建议调用。"
is_idempotent = true
physical_impact = false
timeout_ms = 800
max_retries = 2
retry_delay_ms = 1000

[tools.calculate_route]
provider = "mock"
human_readable_name = "计算路线"
llm_description = "计算两点之间的路线距离和通行时间，支持步行、驾车、公交三种出行方式。用于评估POI间移动时间是否合理。"
is_idempotent = true
physical_impact = false
timeout_ms = 800
max_retries = 2
retry_delay_ms = 1000

# ===== L2 物理操作 — 以下工具产生真实物理影响 =====

[tools.book_table]
provider = "mock"
human_readable_name = "预订餐厅桌位"
llm_description = """
预订指定餐厅的桌位。调用前必须先通过 check_availability 确认有空位。
参数 time_slot 使用 HH:MM 格式（如 19:00），guest_count 为实际就餐人数。
预订成功后桌位将锁定，超时自动释放。此操作影响餐厅真实库存，不可随意重试。
"""
is_idempotent = false
physical_impact = true
timeout_ms = 2000
max_retries = 1
retry_delay_ms = 2000
idempotency_ttl_sec = 14400       # 4小时，覆盖晚餐预订周期
circuit_breaker_threshold = 3
circuit_recovery_s = 60
compensation = "cancel_booking"

[tools.book_ticket]
provider = "mock"
human_readable_name = "预订门票"
llm_description = """
预订景点或活动门票。调用前必须先通过 check_availability 确认有余票。
参数包含POI ID、人数、日期。预订成功后门票库存扣减，此操作影响真实库存，不可随意重试。
"""
is_idempotent = false
physical_impact = true
timeout_ms = 2000
max_retries = 1
retry_delay_ms = 2000
idempotency_ttl_sec = 1200        # 20分钟，覆盖电影锁座+支付周期
circuit_breaker_threshold = 3
circuit_recovery_s = 60
compensation = "cancel_ticket"

[tools.order]
provider = "mock"
human_readable_name = "下单点餐"
llm_description = """
在指定POI下单点餐或购物。参数包含POI ID和菜品/商品列表。
下单后将触发厨房备餐或商家拣货，此操作产生真实物理影响（备餐/库存），不可重试。
"""
is_idempotent = false
physical_impact = true
timeout_ms = 1500
max_retries = 0                   # 不重试（厨房已备餐）
idempotency_ttl_sec = 1800        # 30分钟，覆盖就餐周期
circuit_breaker_threshold = 5
circuit_recovery_s = 30
compensation = "cancel_order"

# ===== L3 通知 =====

[tools.notify]
provider = "mock"
human_readable_name = "发送通知"
llm_description = "向用户发送计划确认通知和分享卡片，支持微信、短信、邮件三种渠道。在所有预订完成后调用。"
is_idempotent = true
physical_impact = false
timeout_ms = 1000
max_retries = 2
retry_delay_ms = 1000
