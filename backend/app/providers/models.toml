# LLM 模型配置
#
# 每个 [models.<alias>] 定义一个可用模型：
#   provider     — Provider 名称（deepseek / openrouter / kimi）
#   api_model    — 传给 API 的实际模型名
#   prompt_per_1k    — 输入价格 (USD / 1K tokens)
#   completion_per_1k — 输出价格 (USD / 1K tokens)
#   max_tokens   — 最大上下文长度
#   supports_streaming — 是否支持流式
#   supports_vision    — 是否支持多模态

[models.deepseek-v4-pro]
provider = "deepseek"
api_model = "deepseek-chat"
prompt_per_1k = 0.00014
completion_per_1k = 0.00028
max_tokens = 65536
supports_streaming = true
supports_vision = false

[models."kimi-2.6"]
provider = "kimi"
api_model = "moonshot-v1-8k"
prompt_per_1k = 0.012
completion_per_1k = 0.012
max_tokens = 8192
supports_streaming = true
supports_vision = false

[models.openrouter-deepseek]
provider = "openrouter"
api_model = "deepseek/deepseek-chat"
prompt_per_1k = 0.00014
completion_per_1k = 0.00028
max_tokens = 65536
supports_streaming = true
supports_vision = false
