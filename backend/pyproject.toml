[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snaptrip-backend"
version = "0.1.0"
description = "SnapTrip API backend"
requires-python = ">=3.11"
dependencies = [
    "snaptrip-shared",
    "snaptrip-agent",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "celery[gevent]>=5.4.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "email-validator>=2.0.0",
    "elasticsearch[async]>=8.15,<9.0",
    "sentence-transformers>=4.0.0",
    "implicit>=0.7.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
]

[tool.uv.sources]
snaptrip-shared = { workspace = true }
snaptrip-agent = { workspace = true }

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["*.j2"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: 单元测试（无外部依赖）",
    "contract: 高德Schema快照测试",
    "integration: 集成测试（需外部服务）",
    "amap: 高德真实API测试（消耗配额）",
    "ci: CI环境可运行的集成测试",
    "slow: 耗时测试",
]

[tool.setuptools.packages.find]
include = ["marketplace*", "app*"]
