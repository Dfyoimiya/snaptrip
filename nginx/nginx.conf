# Nginx routing for SnapTrip
#
# Architecture:
#   /api/admin/*  → marketplace:8000  (B-end admin API)
#   /api/portal/* → marketplace:8000  (C-end portal API — reserved for classmate)
#   /health       → marketplace:8000
#   /             → frontend:5173     (B-end admin SPA; C-end to be added later)

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream marketplace {
        server marketplace:8000;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name _;

        # ── Marketplace APIs ──
        location /api/ {
            proxy_pass http://marketplace;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Health check ──
        location /health {
            proxy_pass http://marketplace;
        }

        # ── Frontend (B-end admin SPA) ──
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
