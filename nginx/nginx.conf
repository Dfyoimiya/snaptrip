# Nginx routing for SnapTrip multi-service architecture
#
# Two strategies (choose one via compose env):
#
# Strategy A (frontend env var, recommended dev):
#   VITE_USE_MOCK=true  → frontend directly calls :8001
#   VITE_USE_MOCK=false → frontend directly calls :8000
#   Nginx only serves static files + proxies backend
#
# Strategy B (Nginx header routing):
#   X-Use-Mock: true    → proxy to mock_server:8001
#   default             → proxy to backend:8000
#
# See docker-compose.yml for integration.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    upstream mock_server {
        server mock_server:8001;
    }

    upstream frontend {
        server frontend:5173;
    }

    # ── Map header to upstream (Strategy B) ──
    map $http_x_use_mock $commerce_upstream {
        default    http://backend;
        "true"     http://mock_server;
    }

    server {
        listen 80;
        server_name _;

        # ── Commerce APIs: C端 + B端 (Strategy B routing) ──
        location /api/client/ {
            proxy_pass $commerce_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/admin/ {
            proxy_pass $commerce_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Tool APIs: always to mock server ──
        location /mock/tools/ {
            proxy_pass http://mock_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/mock/ {
            proxy_pass http://mock_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health checks ──
        location /health {
            proxy_pass http://backend;
        }

        # ── Frontend static + dev server ──
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
