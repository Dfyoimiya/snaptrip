# ===== 开发环境覆盖：热重载 + 绑定挂载 + 开发数据库 =====
# 使用方式:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   make dev

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DB:-snaptrip_dev}

  backend:
    build:
      target: development
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: DEBUG
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8080

  mock-server:
    volumes:
      - ./mock_server:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  celery-worker:
    volumes:
      - ./backend:/app
    command: uv run celery -A app.celery_app worker -l info
