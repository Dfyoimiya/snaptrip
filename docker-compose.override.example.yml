# ===== 开发环境覆盖：热重载 + 绑定挂载 + 开发数据库 =====
# 使用方式:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   make dev

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DB:-snaptrip_dev}

  marketplace:
    build:
      target: development
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: DEBUG
    command: uvicorn marketplace.app.main:app --host 0.0.0.0 --port 8000 --reload

  agent-worker:
    build:
      target: development
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: DEBUG
    command: celery -A marketplace.app.celery_app worker --pool=gevent --concurrency=100 -Q agent -l info

  frontend:
    build:
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8080

  mock-server:
    volumes:
      - ./mock-services/mock-meituan:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
