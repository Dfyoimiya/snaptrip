# ===== 测试环境：独立 DB/Redis，无 volume 持久化 =====
# 使用方式:
#   make test-up        → 启动 test DB + Redis
#   make test-backend   → 启动 test 服务 + 运行测试
#   make test-down      → 停止并清理

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: snaptrip-test-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snaptrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-snaptrip_test}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snaptrip}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"

  redis-test:
    image: redis:7-alpine
    container_name: snaptrip-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"
