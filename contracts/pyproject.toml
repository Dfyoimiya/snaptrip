[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snaptrip-contracts"
version = "0.1.0"
description = "SnapTrip API Contracts — shared Pydantic DTOs, enums, error codes, and ports"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
include = ["contracts*", "schemas*", "ports*"]
